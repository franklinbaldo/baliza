[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baliza"
version = "0.1.0"
description = "Streamlined PNCP data extraction to Parquet using DLT pipeline."
authors = [{ name = "Franklin Baldo", email = "frank@franklinbaldo.com" }]
requires-python = ">=3.11"

dependencies = [
    "dlt[duckdb]>=1.14.1",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "xxhash>=3.4.1",
    "internetarchive>=4.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "vcrpy>=6.0.0",
    "pytest-vcr>=1.0.2"
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0"
]
internet-archive = [
    "internetarchive>=3.5.0"
]

[project.scripts]
baliza = "baliza.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
baliza = ["config/*.yml", "config/*.yaml"]

# Ensure pytest discovers the local source package without requiring PYTHONPATH hacks
[tool.pytest.ini_options]
pythonpath = ["src"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = [
    "B008",     # typer.Option in function defaults is the standard Typer pattern
    "PLR0913",  # Too many arguments - acceptable for complex but well-structured functions
    "PLR0912",  # Too many branches - acceptable for complex but well-structured functions
    "PLR0915",  # Too many statements - acceptable for complex but well-structured functions
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # Magic values in test assertions are fine and expected
    "E501",     # Line length can exceed 100 chars in tests (table definitions, etc.)
]
"scripts/**/*.py" = [
    "PLR2004",  # Magic values in scripts are acceptable (HTTP status codes, etc.)
    "E501",     # Line length can exceed 100 chars in scripts
]
"debug_api.py" = [
    "PLR2004",  # Magic values acceptable in debug scripts
]
"src/baliza/cli.py" = [
    "E501",     # Some docstrings and protocol definitions exceed 100 chars
    "PLC0415",  # Import inside function for fallback HTTP client is intentional
    "PLW0603",  # Global statement for HTTP client factory is intentional
    "PLR2004",  # Magic values acceptable (HTTP codes, month numbers, display limits)
    "B904",     # Exception handling pattern for CLI exit is appropriate
]
"src/baliza/state/coverage.py" = [
    "E501",     # Some error messages and SQL queries exceed 100 chars
    "PLR2004",  # Magic values for hash lengths and data validation are acceptable
]
"src/baliza/state/gaps.py" = [
    "E501",     # Repr strings can exceed 100 chars
]
"src/baliza/state/manager.py" = [
    "E501",     # Docstrings can exceed 100 chars
]
"src/baliza/utils/dates.py" = [
    "PLR2004",  # Magic values for date string length validation are acceptable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Removed: dependency-groups replaced by optional-dependencies
