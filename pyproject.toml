[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baliza"
version = "0.1.0"
description = "Streamlined PNCP data extraction to Parquet using DLT pipeline."
authors = [{ name = "Franklin Baldo", email = "frank@franklinbaldo.com" }]
requires-python = ">=3.11"

dependencies = [
    "dlt[duckdb]>=1.14.1",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "xxhash>=3.4.1",
    "internetarchive>=4.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0"
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0"
]
internet-archive = [
    "internetarchive>=3.5.0"
]

[project.scripts]
baliza = "baliza.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

# Ensure pytest discovers the local source package without requiring PYTHONPATH hacks
[tool.pytest.ini_options]
pythonpath = ["src"]

# Removed: dependency-groups replaced by optional-dependencies
