[project]
name = "baliza"
version = "0.1.0"
description = "Streamlined PNCP data extraction to Parquet using DLT pipeline."
authors = [{ name = "Franklin Baldo", email = "frank@franklinbaldo.com" }]
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]",
    "pyarrow",
    "typer",
    "PyYAML",
    "duckdb",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-cov",
    "requests",
    "datamodel-code-generator>=0.32.0",
]
[project.scripts]
baliza = "baliza.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baliza"]
