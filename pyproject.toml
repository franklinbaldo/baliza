[project]
name = "baliza"
version = "0.1.0"
description = "Streamlined PNCP data extraction to Parquet using DLT pipeline."
authors = [{ name = "Franklin Baldo", email = "frank@franklinbaldo.com" }]
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]",
    "pyarrow",
    "typer",
    "PyYAML",
    "duckdb",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit", 
    "ruff",
    "pytest",
    "pytest-cov",
    "requests",
]
[project.scripts]
baliza = "src.baliza.cli:app"
