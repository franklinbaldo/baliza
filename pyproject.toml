[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baliza"
version = "0.1.0"
description = "Simple PNCP data extraction tool using httpx and DuckDB."
authors = [{ name = "Franklin Baldo", email = "frank@franklinbaldo.com" }]
requires-python = ">=3.12"

dependencies = [
    "typer>=0.9.0",
    "httpx[http2]>=0.27.0",
    "rich>=13.0.0",
    "duckdb>=1.4.3",
    "pyarrow>=14.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
    "internetarchive>=5.8.0",
    "ibis-framework[duckdb]>=12.0.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "vcrpy>=6.0.0",
    "pytest-vcr>=1.0.2",
    "pytest-bdd>=7.0.0"
]

[project.scripts]
baliza = "baliza.cli_simple:app"

[tool.setuptools]
package-dir = {"" = "src"}

# Ensure pytest discovers the local source package without requiring PYTHONPATH hacks
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
markers = [
    "tier0: Tier 0 (Critical Path) - Without these, tool is useless",
    "tier1: Tier 1 (Core Features) - Essential for production use",
    "tier2: Tier 2 (Operator Experience) - Quality-of-life improvements",
    "tier3: Tier 3 (Future Enhancements) - Aspirational features",
    "smoke: Smoke tests for critical functionality",
    "resilience: Tests for error handling and recovery",
    "edge-case: Tests for edge cases and boundary conditions",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = [
    "PLR2004",  # Magic values are fine in tests/scripts
    "B008",     # Function calls in default args (common with typer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E501",     # Line length in tests is flexible
    "PLC0415",  # Imports in functions are common in tests (traceback)
    "PLR0913",  # Many arguments in test fixtures is fine
]
"scripts/**/*.py" = [
    "E501",     # Line length in scripts is flexible
    "PLR0913",  # Many arguments in scripts is fine
]
"*.py" = [
    "E501",  # Relax line length everywhere (100 is strict)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    # Pinned exactly, not floored. ruff.toml selects rule families ("PL", "B",
    # ...), so a release that stabilises a preview rule inside one of them joins
    # the gate automatically -- and uv.lock is gitignored, so nothing else holds
    # the version steady. Moving to a newer ruff should be a deliberate PR that
    # decides which newly stabilised rules we want.
    "ruff==0.16.2",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest-bdd>=7.0.0",
    "types-requests>=2.33.0.20260408",
]
