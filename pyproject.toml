[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baliza"
version = "0.1.0"
description = "Simple PNCP data extraction tool using httpx and DuckDB."
authors = [{ name = "Franklin Baldo", email = "frank@franklinbaldo.com" }]
requires-python = ">=3.11"

dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "duckdb>=1.4.3",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "vcrpy>=6.0.0",
    "pytest-vcr>=1.0.2",
    "pytest-bdd>=7.0.0"
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0"
]

[project.scripts]
baliza = "baliza.cli_simple:app"

[tool.setuptools]
package-dir = {"" = "src"}

# Ensure pytest discovers the local source package without requiring PYTHONPATH hacks
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "tier0: Tier 0 (Critical Path) - Without these, tool is useless",
    "tier1: Tier 1 (Core Features) - Essential for production use",
    "tier2: Tier 2 (Operator Experience) - Quality-of-life improvements",
    "tier3: Tier 3 (Future Enhancements) - Aspirational features",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = [
    "PLR2004",  # Magic values are fine in tests/scripts
    "B008",     # Function calls in default args (common with typer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E501",     # Line length in tests is flexible
    "PLC0415",  # Imports in functions are common in tests (traceback)
    "PLR0913",  # Many arguments in test fixtures is fine
]
"scripts/**/*.py" = [
    "E501",     # Line length in scripts is flexible
    "PLR0913",  # Many arguments in scripts is fine
]
"*.py" = [
    "E501",  # Relax line length everywhere (100 is strict)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
