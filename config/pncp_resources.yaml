# PNCP API Resources Configuration
# Configuração dos endpoints da API PNCP para extração via DLT
# Baseado na documentação MANUAL-PNCP-CONSULTAS-VERSAO-1.md e análise dos scripts

# ESTRATÉGIA MULTI-MODALIDADE:
# - Endpoints que REQUEREM modalidade: geram 13 resources automáticos (mod1-mod13)
# - Endpoints que NÃO REQUEREM modalidade: usam 1 resource único
# Resultado: backup 100% completo de todas as 13 modalidades

# Recursos de sincronização contínua (atualizações incrementais)
sync_resources:
  # ⚠️ REQUER MODALIDADE - será expandido para 13 resources automáticos
  - name: "contratacoes_atualizacao"
    table_name: "contratacao_publicacao"
    primary_key: "numeroControlePNCP"
    write_disposition: "merge"
    endpoint:
      path: "/v1/contratacoes/atualizacao"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será substituído por incremental
        dataFinal: "20241231"    # Data atual será aplicada
        # codigoModalidadeContratacao: SERÁ ADICIONADO AUTOMATICAMENTE (1-13)
        pagina: 1
        tamanhoPagina: 500
      incremental:
        cursor_path: "dataAtualizacao"
        initial_value: "20240101"
      
  # ✅ NÃO REQUER MODALIDADE - resource único (pega todas automaticamente)
  - name: "contratos_atualizacao"
    table_name: "contrato"
    primary_key: "numeroControlePNCP"
    write_disposition: "merge"
    endpoint:
      path: "/v1/contratos/atualizacao"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será substituído por incremental
        dataFinal: "20241231"    # Data atual será aplicada
        # SEM codigoModalidadeContratacao - endpoint pega todas as modalidades
        pagina: 1
        tamanhoPagina: 500
      incremental:
        cursor_path: "dataAtualizacao"
        initial_value: "20240101"

  # ✅ NÃO REQUER MODALIDADE - modalidade não se aplica a atas
  - name: "atas_atualizacao"
    table_name: "ata_registro_preco"
    primary_key: "numeroControlePNCPAta"
    write_disposition: "merge"
    endpoint:
      path: "/v1/atas/atualizacao"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será substituído por incremental
        dataFinal: "20241231"    # Data atual será aplicada
        # SEM codigoModalidadeContratacao - não se aplica a atas
        pagina: 1
        tamanhoPagina: 500
      incremental:
        cursor_path: "dataAtualizacao"
        initial_value: "20240101"

# Recursos de backfill (cargas históricas com chunking)
backfill_resources:
  # ⚠️ REQUER MODALIDADE - será expandido para 13 resources automáticos
  - name: "contratacoes_publicacao"
    table_name: "contratacao_publicacao"
    primary_key: "numeroControlePNCP"
    write_disposition: "replace"
    endpoint:
      path: "/v1/contratacoes/publicacao"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será ajustado dinamicamente
        dataFinal: "20241231"    # Será ajustado dinamicamente
        # codigoModalidadeContratacao: SERÁ ADICIONADO AUTOMATICAMENTE (1-13)
        pagina: 1
        tamanhoPagina: 500

  # ✅ NÃO REQUER MODALIDADE - resource único (pega todas automaticamente)
  - name: "contratos"
    table_name: "contrato"
    primary_key: "numeroControlePNCP"
    write_disposition: "replace"
    endpoint:
      path: "/v1/contratos"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será ajustado dinamicamente
        dataFinal: "20241231"    # Será ajustado dinamicamente
        # SEM codigoModalidadeContratacao - endpoint pega todas as modalidades
        pagina: 1
        tamanhoPagina: 500

  # ✅ NÃO REQUER MODALIDADE - modalidade não se aplica a atas
  - name: "atas"
    table_name: "ata_registro_preco"
    primary_key: "numeroControlePNCPAta"
    write_disposition: "replace"
    endpoint:
      path: "/v1/atas"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será ajustado dinamicamente
        dataFinal: "20241231"    # Será ajustado dinamicamente
        # SEM codigoModalidadeContratacao - não se aplica a atas
        pagina: 1
        tamanhoPagina: 500

# Recursos especializados (PCA e outros)
specialized_resources:
  # ✅ NÃO REQUER MODALIDADE - PCA não tem conceito de modalidade
  - name: "pca_usuario"
    table_name: "plano_contratacao"
    primary_key: "idPcaPncp"
    write_disposition: "replace"
    endpoint:
      path: "/v1/pca/usuario"
      data_selector: "data"
      params:
        anoPca: 2024
        idUsuario: 1
        pagina: 1
        tamanhoPagina: 500

  # ✅ NÃO REQUER MODALIDADE - instrumentos de cobrança não têm modalidade
  - name: "instrumentos_cobranca"
    table_name: "instrumento_cobranca"
    primary_key: ["cnpj", "ano", "sequencialContrato", "sequencialInstrumentoCobranca"]
    write_disposition: "merge"
    endpoint:
      path: "/v1/instrumentoscobranca/inclusao"
      data_selector: "data"
      params:
        dataInicial: "20240101"  # Será substituído por incremental
        dataFinal: "20241231"    # Data atual será aplicada
        pagina: 1
        tamanhoPagina: 500
      incremental:
        cursor_path: "dataInclusao"
        initial_value: "20240101"

# =============================================================================
# RESUMO DA ESTRATÉGIA MULTI-MODALIDADE
# =============================================================================
# ENDPOINTS QUE REQUEREM MODALIDADE (geram 13 resources cada):
#   ⚠️ contratacoes_publicacao    -> contratacoes_publicacao_mod1 até mod13
#   ⚠️ contratacoes_atualizacao   -> contratacoes_atualizacao_mod1 até mod13
#
# ENDPOINTS QUE NÃO REQUEREM MODALIDADE (1 resource único cada):
#   ✅ contratos                  -> pega todas as modalidades automaticamente
#   ✅ contratos_atualizacao      -> pega todas as modalidades automaticamente
#   ✅ atas                       -> modalidade não se aplica
#   ✅ atas_atualizacao           -> modalidade não se aplica
#   ✅ pca_usuario                -> modalidade não se aplica
#   ✅ instrumentos_cobranca      -> modalidade não se aplica
#
# RESULTADO: Backup 100% completo de todas as 13 modalidades definidas em:
# schemas.py -> ModalidadeContratacao (1=Leilão Eletrônico até 13=Leilão Presencial)
# =============================================================================