<svg width="0" height="0" aria-hidden="true">
<defs>

<!-- Masks ------------------------------------------------------------ -->
<mask id="cobogo-mask">
  <rect width="100" height="100" fill="white"/>
  <rect x="40" y="0" width="20" height="100" fill="black"/>
  <rect x="0" y="40" width="100" height="20" fill="black"/>
  <circle cx="50" cy="50" r="22" fill="black"/>
</mask>

<!-- Tiles Bulcão ---------------------------------------------------- -->
<symbol id="t1" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="var(--bulcao-bg)"/>
  <circle cx="0" cy="0" r="50" fill="var(--bulcao-fg)"/>
  <circle cx="100" cy="100" r="50" fill="var(--bulcao-fg)"/>
</symbol>
<symbol id="t2" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="var(--bulcao-bg)"/>
  <circle cx="50" cy="100" r="50" fill="var(--bulcao-fg)"/>
</symbol>
<symbol id="t3" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="var(--bulcao-bg)"/>
  <polygon points="0,0 100,0 0,100" fill="var(--bulcao-fg)"/>
</symbol>
<symbol id="t4" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="var(--bulcao-bg)"/>
  <path d="M 0 50 Q 25 25 50 50 T 100 50 L 100 100 L 0 100 Z" fill="var(--bulcao-fg)"/>
</symbol>
<symbol id="t5" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="var(--bulcao-fg)" mask="url(#cobogo-mask)"/>
</symbol>
<symbol id="t6" viewBox="0 0 100 100" preserveAspectRatio="none">
  <rect x="0" y="0" width="100" height="20" fill="var(--bulcao-fg)"/>
  <rect x="0" y="20" width="100" height="50" fill="var(--bulcao-bg)"/>
  <rect x="0" y="70" width="100" height="30" fill="var(--bulcao-accent)"/>
</symbol>

<!-- Ícones UI (24×24, stroke) -------------------------------------- -->
<symbol id="ic-menu" viewBox="0 0 24 24">
  <line x1="4" y1="7" x2="20" y2="7"/>
  <line x1="4" y1="12" x2="20" y2="12"/>
  <line x1="4" y1="17" x2="20" y2="17"/>
</symbol>
<symbol id="ic-close" viewBox="0 0 24 24">
  <line x1="6" y1="6" x2="18" y2="18"/>
  <line x1="18" y1="6" x2="6" y2="18"/>
</symbol>
<symbol id="ic-search" viewBox="0 0 24 24">
  <circle cx="11" cy="11" r="6"/>
  <line x1="15.5" y1="15.5" x2="20" y2="20"/>
</symbol>
<symbol id="ic-arrow-right" viewBox="0 0 24 24">
  <line x1="4" y1="12" x2="20" y2="12"/>
  <polyline points="14,6 20,12 14,18"/>
</symbol>
<symbol id="ic-chevron-down" viewBox="0 0 24 24">
  <polyline points="6,9 12,15 18,9"/>
</symbol>
<symbol id="ic-share" viewBox="0 0 24 24">
  <polyline points="9,6 15,6 15,12"/>
  <line x1="15" y1="6" x2="8" y2="13"/>
  <path d="M 5 11 L 5 19 L 19 19 L 19 11"/>
</symbol>
<symbol id="ic-download" viewBox="0 0 24 24">
  <line x1="12" y1="4" x2="12" y2="15"/>
  <polyline points="7,10 12,15 17,10"/>
  <line x1="4" y1="20" x2="20" y2="20"/>
</symbol>
<symbol id="ic-plus" viewBox="0 0 24 24">
  <line x1="12" y1="5" x2="12" y2="19"/>
  <line x1="5" y1="12" x2="19" y2="12"/>
</symbol>
<symbol id="ic-minus" viewBox="0 0 24 24">
  <line x1="5" y1="12" x2="19" y2="12"/>
</symbol>
<symbol id="ic-check" viewBox="0 0 24 24">
  <polyline points="5,13 10,18 20,6"/>
</symbol>
<symbol id="ic-x" viewBox="0 0 24 24">
  <line x1="7" y1="7" x2="17" y2="17"/>
  <line x1="17" y1="7" x2="7" y2="17"/>
</symbol>
<symbol id="ic-external" viewBox="0 0 24 24">
  <polyline points="10,4 20,4 20,14"/>
  <line x1="20" y1="4" x2="10" y2="14"/>
  <path d="M 16 14 L 16 20 L 4 20 L 4 8 L 10 8"/>
</symbol>
<symbol id="ic-bookmark" viewBox="0 0 24 24">
  <path d="M 6 4 L 18 4 L 18 20 L 12 15 L 6 20 Z"/>
</symbol>
<symbol id="ic-filter" viewBox="0 0 24 24">
  <line x1="4" y1="7" x2="20" y2="7"/>
  <line x1="7" y1="12" x2="17" y2="12"/>
  <line x1="10" y1="17" x2="14" y2="17"/>
</symbol>
<symbol id="ic-more" viewBox="0 0 24 24">
  <circle cx="6" cy="12" r="1.5" fill="currentColor"/>
  <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
  <circle cx="18" cy="12" r="1.5" fill="currentColor"/>
</symbol>
<symbol id="ic-info" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="8"/>
  <line x1="12" y1="11" x2="12" y2="17"/>
  <circle cx="12" cy="7.5" r="0.5" fill="currentColor" stroke="none"/>
</symbol>

<!-- Glifos ornamentais --------------------------------------------- -->
<symbol id="gl-volpi" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="currentColor"/>
</symbol>
<symbol id="gl-tarsila" viewBox="0 0 100 100">
  <polygon points="50,15 85,80 15,80" fill="currentColor"/>
</symbol>
<symbol id="gl-losango" viewBox="0 0 100 100">
  <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="currentColor" stroke-width="4"/>
</symbol>
<symbol id="gl-sol" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="18" fill="currentColor"/>
  <g stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="10" x2="50" y2="22"/>
    <line x1="50" y1="78" x2="50" y2="90"/>
    <line x1="10" y1="50" x2="22" y2="50"/>
    <line x1="78" y1="50" x2="90" y2="50"/>
    <line x1="22" y1="22" x2="30" y2="30"/>
    <line x1="70" y1="70" x2="78" y2="78"/>
    <line x1="78" y1="22" x2="70" y2="30"/>
    <line x1="22" y1="78" x2="30" y2="70"/>
  </g>
</symbol>
<symbol id="gl-end" viewBox="0 0 100 100">
  <circle cx="25" cy="50" r="8" fill="currentColor"/>
  <rect x="45" y="42" width="16" height="16" fill="currentColor"/>
  <polygon points="80,42 92,58 68,58" fill="currentColor"/>
</symbol>
<symbol id="gl-arrow-orn" viewBox="0 0 100 100">
  <line x1="10" y1="50" x2="70" y2="50" stroke="currentColor" stroke-width="4"/>
  <circle cx="80" cy="50" r="10" fill="currentColor"/>
</symbol>
<symbol id="gl-cruz" viewBox="0 0 100 100">
  <rect x="42" y="10" width="16" height="80" fill="currentColor"/>
  <rect x="10" y="42" width="80" height="16" fill="currentColor"/>
  <circle cx="50" cy="50" r="14" fill="var(--neutral-0)"/>
</symbol>
<symbol id="gl-wave" viewBox="0 0 100 100">
  <path d="M 10 50 Q 30 30 50 50 T 90 50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</symbol>

<!-- Formas de fundo grandes --------------------------------------- -->
<symbol id="sh-parabola" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <path d="M 0 300 Q 200 -80 400 300 Z" fill="currentColor"/>
</symbol>
<symbol id="sh-blob" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <path d="M 60 200
           C 20 120, 100 30, 180 60
           C 260 90, 290 20, 350 90
           C 400 150, 330 220, 280 230
           C 230 240, 200 280, 130 270
           C 70 260, 100 230, 60 200 Z" fill="currentColor"/>
</symbol>
<symbol id="sh-onda" viewBox="0 0 400 100" preserveAspectRatio="none">
  <path d="M 0 50 Q 50 0 100 50 T 200 50 T 300 50 T 400 50 L 400 100 L 0 100 Z" fill="currentColor"/>
</symbol>
<symbol id="sh-arco" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <path d="M 0 300 L 0 200 A 200 200 0 0 1 400 200 L 400 300 Z" fill="currentColor"/>
</symbol>

</defs>
</svg>
