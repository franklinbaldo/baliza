# dlt secrets.toml: configuration for dlt sources
# This file is gitignored and should not be committed to version control.
# Use this file to store your credentials and other sensitive information.

# Configurações para a fonte 'baliza_source', definida em src/baliza/pipeline.py
api_secret_key = "<configure me>" # fill this in!

[sources.baliza_source]
base_url = "https://pncp.gov.br/api/pncp"

# A API do PNCP é pública e não requer token de autenticação no momento.
# Se no futuro for necessário um token (Bearer, API Key, etc.),
# ele seria adicionado aqui para ser acessado via dlt.secrets.value.
# Exemplo:
# token = "seu_token_aqui"


