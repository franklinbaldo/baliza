version: 2
project_name: pncp-pp-cli
changelog:
  disable: true
builds:
  - id: pncp-pp-cli
    main: ./cmd/pncp-pp-cli
    binary: pncp-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X pncp-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: pncp-pp-mcp
    main: ./cmd/pncp-pp-mcp
    binary: pncp-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: pncp-pp-cli
    repository:
      owner: claude
      name: homebrew-tap
    homepage: "https://github.com/claude/pncp-pp-cli"
    description: "API REST de serviços do Portal Nacional de Contratações Públicas (PNCP)"
    install: |
      bin.install "pncp-pp-cli"
      bin.install "pncp-pp-mcp"
