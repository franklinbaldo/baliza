name: Weekly Consolidation

# Rebuilds annual consolidated Parquet files on Internet Archive every Sunday.
# Frozen past years are skipped if they already have a consolidated file.
# The current year is always rebuilt to include the latest week's data.
#
# Secrets required: IA_ACCESS_KEY, IA_SECRET_KEY

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday at 06:00 UTC (after daily run finishes)
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-upload even for frozen years (true/false)'
        required: false
        default: 'false'

concurrency:
  group: pncp-weekly-consolidation
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  consolidate:
    name: Build and upload annual consolidated Parquet files
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run consolidation
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          uv run baliza consolidate --start-year 2021 $FORCE_FLAG

  report-failure:
    name: Report workflow failure
    if: ${{ failure() }}
    needs: consolidate
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const identifier = `run_id:${runId}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${identifier}" state:open type:issue`
            });
            if (search.data.total_count > 0) return;

            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Falha no workflow "Weekly Consolidation" (run #${context.runNumber})`,
              body: [
                '@codex há uma falha automática no workflow de consolidação semanal.',
                '',
                `- **Workflow**: Weekly Consolidation`,
                `- **Execução**: [#${context.runNumber}](${runUrl})`,
                `- **Identificador**: ${identifier}`,
              ].join('\n'),
              labels: ['ci-failure']
            });
