name: Monthly Release

# Secrets: o workflow usa apenas o GITHUB_TOKEN padrão para criar publicações.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  release:
    name: Build and publish monthly dataset
    runs-on: ubuntu-latest
    env:
      IA_SUMMARY_PATH: internet-archive-summary.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Resolve reference month
        id: reference
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone

          today = datetime.now(timezone.utc).replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          previous_month = today - timedelta(days=1)
          reference = previous_month.strftime('%Y-%m')
          year, month = reference.split('-')

          with open('$GITHUB_OUTPUT', 'a', encoding='utf-8') as fh:
            fh.write(f"reference={reference}\n")
            fh.write(f"year={year}\n")
            fh.write(f"month={month}\n")
          PY

      - name: Backfill previous month
        run: |
          baliza backfill ${{ steps.reference.outputs.reference }} ${{ steps.reference.outputs.reference }} \
            --duckdb baliza.duckdb \
            --dataset baliza_raw

      - name: Export parquet for reference month
        run: |
          python scripts/export_parquet.py \
            contratos \
            --duckdb baliza.duckdb \
            --dataset baliza_raw \
            --output-dir data/contratos \
            --date-col dataPublicacaoPncp \
            --fallback-date-col dataAtualizacao \
            --target-month ${{ steps.reference.outputs.reference }}

      - name: Build manifest
        id: manifest
        env:
          MANIFEST_DIR: data/contratos/ano=${{ steps.reference.outputs.year }}/mes=${{ steps.reference.outputs.month }}
          DATASET_VERSION: ${{ steps.reference.outputs.reference }}
        run: |
          python scripts/build_manifest.py \
            --parquet-dir "$MANIFEST_DIR" \
            --dataset-version "$DATASET_VERSION"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ['MANIFEST_DIR']) / 'manifest.json'
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          body = (
              f"Dataset version: {data['dataset_version']}\n"
              f"Row count: {data['row_count']}\n"
              f"Interval: {data['min_data']} → {data['max_data']}\n"
          )
          with open('$GITHUB_OUTPUT', 'a', encoding='utf-8') as fh:
            fh.write('manifest_path=' + str(manifest_path) + '\n')
            fh.write('release_body<<EOF\n')
            fh.write(body)
            fh.write('EOF\n')
          PY

      - name: Package monthly snapshot
        env:
          MANIFEST_DIR: data/contratos/ano=${{ steps.reference.outputs.year }}/mes=${{ steps.reference.outputs.month }}
          REFERENCE: ${{ steps.reference.outputs.reference }}
        run: |
          tar -czf contratos-${REFERENCE}.tar.gz "$MANIFEST_DIR"

      - name: Install Internet Archive client
        if: ${{ secrets.IA_ACCESS_KEY && secrets.IA_SECRET_KEY }}
        run: |
          pip install internetarchive

      - name: Upload package to Internet Archive
        if: ${{ secrets.IA_ACCESS_KEY && secrets.IA_SECRET_KEY }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          REFERENCE: ${{ steps.reference.outputs.reference }}
        run: |
          python scripts/upload_internet_archive.py \
            --file contratos-${REFERENCE}.tar.gz \
            --manifest "$MANIFEST_PATH" \
            --identifier baliza-contratos-${REFERENCE} \
            --metadata-output "$IA_SUMMARY_PATH"

      - name: Publicar artefato sincronizado com o Internet Archive
        if: ${{ secrets.IA_ACCESS_KEY && secrets.IA_SECRET_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: internet-archive-${{ steps.reference.outputs.reference }}
          path: |
            contratos-${{ steps.reference.outputs.reference }}.tar.gz
            ${{ env.IA_SUMMARY_PATH }}

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.reference.outputs.reference }}
          release_name: Baliza contratos ${{ steps.reference.outputs.reference }}
          body: ${{ steps.manifest.outputs.release_body }}
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: contratos-${{ steps.reference.outputs.reference }}.tar.gz
          asset_name: contratos-${{ steps.reference.outputs.reference }}.tar.gz
          asset_content_type: application/gzip

  report-failure:
    name: Report workflow failure
    if: ${{ failure() }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const attempt = context.runAttempt;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const workflowName = context.workflow;
            const identifier = `run_id:${runId}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${identifier}" state:open type:issue`
            });

            if (search.data.total_count > 0) {
              core.info('Existing issue found for this run, skipping creation.');
              return;
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner,
              repo,
              run_id: runId,
              attempt_number: attempt,
              per_page: 100
            });

            const failureDetails = [];
            const failingConclusions = new Set(['failure', 'cancelled', 'timed_out']);
            for (const job of jobsResponse.data.jobs) {
              if (!failingConclusions.has(job.conclusion)) {
                continue;
              }

              const stepLines = [];
              for (const step of job.steps ?? []) {
                if (failingConclusions.has(step.conclusion)) {
                  stepLines.push(`    • ${step.name} (${step.conclusion})`);
                }
              }

              if (stepLines.length > 0) {
                failureDetails.push(`- ${job.name} (${job.conclusion})\n${stepLines.join('\n')}`);
              } else {
                failureDetails.push(`- ${job.name} (${job.conclusion})`);
              }
            }

            const lines = [
              '@codex há uma falha automática no workflow agendado.',
              '',
              `- **Workflow**: ${workflowName}`,
              `- **Execução**: [#${context.runNumber}](${runUrl})`,
              `- **Evento**: ${context.eventName}`,
              `- **SHA**: ${context.sha}`,
            ];

            if (failureDetails.length > 0) {
              lines.push('', 'Jobs com falha:', ...failureDetails);
            }

            lines.push('', `Identificador automático: ${identifier}`);

            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Falha no workflow "${workflowName}" (run #${context.runNumber})`,
              body: lines.join('\n'),
              labels: ['ci-failure']
            });
