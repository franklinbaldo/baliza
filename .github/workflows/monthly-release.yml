name: Monthly Release

# Runs on the 1st of every month to backfill the prior month onto
# Internet Archive (via `baliza sync --force-month`) and publish a
# GitHub release pointing at the resulting IA item.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      reference:
        description: 'Month to release (YYYY-MM). Defaults to previous month.'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  release:
    name: Backfill and release previous month
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Resolve reference month
        id: reference
        run: |
          if [ -n "${{ inputs.reference }}" ]; then
            REF="${{ inputs.reference }}"
          else
            REF=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          fi
          echo "reference=$REF" >> "$GITHUB_OUTPUT"
          echo "ia_identifier=baliza-pncp-$REF" >> "$GITHUB_OUTPUT"

      - name: Backfill previous month
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run baliza sync --force-month "${{ steps.reference.outputs.reference }}"

      - name: Verify upload on Internet Archive
        run: |
          uv run baliza verify \
            --start "${{ steps.reference.outputs.reference }}-01" \
            --end "${{ steps.reference.outputs.reference }}-01"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.reference.outputs.reference }}
          name: Baliza contratos ${{ steps.reference.outputs.reference }}
          body: |
            Monthly snapshot of PNCP contracts for ${{ steps.reference.outputs.reference }}.

            Data is distributed via Internet Archive:
            https://archive.org/details/${{ steps.reference.outputs.ia_identifier }}
          draft: false
          prerelease: false

  report-failure:
    name: Report workflow failure
    if: ${{ failure() }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const attempt = context.runAttempt;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const workflowName = context.workflow;
            const identifier = `run_id:${runId}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${identifier}" state:open type:issue`
            });

            if (search.data.total_count > 0) {
              core.info('Existing issue found for this run, skipping creation.');
              return;
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner,
              repo,
              run_id: runId,
              attempt_number: attempt,
              per_page: 100
            });

            const failureDetails = [];
            const failingConclusions = new Set(['failure', 'cancelled', 'timed_out']);
            for (const job of jobsResponse.data.jobs) {
              if (!failingConclusions.has(job.conclusion)) {
                continue;
              }

              const stepLines = [];
              for (const step of job.steps ?? []) {
                if (failingConclusions.has(step.conclusion)) {
                  stepLines.push(`    • ${step.name} (${step.conclusion})`);
                }
              }

              if (stepLines.length > 0) {
                failureDetails.push(`- ${job.name} (${job.conclusion})\n${stepLines.join('\n')}`);
              } else {
                failureDetails.push(`- ${job.name} (${job.conclusion})`);
              }
            }

            const lines = [
              '@codex há uma falha automática no workflow agendado.',
              '',
              `- **Workflow**: ${workflowName}`,
              `- **Execução**: [#${context.runNumber}](${runUrl})`,
              `- **Evento**: ${context.eventName}`,
              `- **SHA**: ${context.sha}`,
            ];

            if (failureDetails.length > 0) {
              lines.push('', 'Jobs com falha:', ...failureDetails);
            }

            lines.push('', `Identificador automático: ${identifier}`);

            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Falha no workflow "${workflowName}" (run #${context.runNumber})`,
              body: lines.join('\n'),
              labels: ['ci-failure']
            });
