name: PNCP Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Oldest date to backfill to (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
      batch_size:
        description: 'Number of dates to process per run'
        required: false
        default: '5'

concurrency:
  group: pncp-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync PNCP to Internet Archive
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run Sync
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run baliza sync \
            --start-date "${{ github.event.inputs.start_date || '2023-01-01' }}" \
            --batch-size "${{ github.event.inputs.batch_size || '5' }}"
