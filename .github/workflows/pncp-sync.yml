name: PNCP Sync

on:
  # Policy: prioritize freshness over replaying old schedule ticks.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Oldest date to backfill to (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
      no_consolidate:
        description: 'Skip end-of-run annual consolidation'
        required: false
        type: boolean
        default: false
      resource:
        description: 'PNCP resource to sync (cron always uses contratos)'
        required: false
        type: choice
        default: contratos
        # Keep this list in sync with the active RESOURCES dict in
        # src/baliza/resources/__init__.py — a typo here just produces
        # a friendly CLI error, but the dropdown is the only UX the
        # operator sees from the Actions page.
        options:
          - contratos
          - atas

concurrency:
  # Policy: cron runs share one group so stale queued/in-flight ticks are canceled.
  # Manual dispatch runs use per-run groups so they are never canceled by schedule activity.
  group: ${{ github.event_name == 'schedule' && 'pncp-sync-schedule' || format('pncp-sync-dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      # Sync only reads the repo and writes IA — no longer needs
      # contents:write (used to push refreshed sync_stats.json before
      # that file was made build-time-only).
      contents: read
      issues: write
    env:
      # Keep a 3-minute buffer vs timeout-minutes=360 so the CLI exits gracefully first.
      SYNC_LIMIT_MINUTES: 357
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
      - id: month
        run: echo "key=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: data/raw
          key: pncp-raw-${{ steps.month.outputs.key }}-${{ github.run_id }}
          restore-keys: pncp-raw-${{ steps.month.outputs.key }}-
      - env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # The cron path defaults to contratos so the production cadence
          # stays unchanged. workflow_dispatch can override via the
          # `resource` input to backfill atas (or any future resource).
          RESOURCE: ${{ inputs.resource || 'contratos' }}
        run: |
          sync_args=(
            --limit-minutes 280
            --resource "$RESOURCE"
          )
          if [[ -n "${{ inputs.start_date }}" ]]; then
            sync_args+=(--start-date "${{ inputs.start_date }}")
          fi
          if [[ "${{ inputs.no_consolidate }}" == "true" ]]; then
            sync_args+=(--no-consolidate)
          fi

          uv run baliza sync "${sync_args[@]}"

      # The web build regenerates web/public/data/sync_stats.json from
      # the IA manifest on every deploy (web/scripts/build-data.mjs ->
      # scripts/build_sync_stats.py), so the homepage's "Sinal do
      # arquivo" tile picks up the latest numbers each time we publish.
      # The previous "refresh + commit" pair that ran here on every
      # cron tick produced a steady stream of "chore(stats)" commits
      # with no signal — removed.

  report-failure:
    name: Report workflow failure
    # Only the production cadence (cron on default branch) updates the
    # shared tracking issue. Feature-branch workflow_dispatch runs are
    # experiments — their failures shouldn't pollute the incident thread.
    if: ${{ failure() && github.ref_name == github.event.repository.default_branch }}
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Open or update single tracking issue for sync failures
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Single rolling tracking issue. The previous behavior filed a
            // fresh issue per failed run, which produced 67 open duplicates
            // in a single bad week. Now we keep one open issue and append
            // a comment per recurrence, so triagers see the failure cadence
            // without drowning in stacked tickets.
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const TRACKING_TITLE = '🚨 PNCP Sync workflow is failing';

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });
            const existing = open.data.find((i) => i.title === TRACKING_TITLE);
            const body = [
              `Latest failure: [run #${context.runNumber}](${runUrl})`,
              '',
              'Comments below track every subsequent failed run. The issue',
              'is auto-closed by the next successful run.',
            ].join('\n');

            if (!existing) {
              await github.rest.issues.create({
                owner, repo,
                title: TRACKING_TITLE,
                body,
                labels: ['ci-failure'],
              });
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: `Failure recurred: [run #${context.runNumber}](${runUrl})`,
            });

  report-recovery:
    name: Auto-close tracking issue on green run
    # Same default-branch guard as report-failure: a green feature-branch
    # dispatch must not falsely declare the production sync recovered.
    if: ${{ success() && github.ref_name == github.event.repository.default_branch }}
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const TRACKING_TITLE = '🚨 PNCP Sync workflow is failing';
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });
            const existing = open.data.find((i) => i.title === TRACKING_TITLE);
            if (!existing) return;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: `Sync recovered: [run #${context.runNumber}](${runUrl}). Closing.`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, state: 'closed',
            });
