name: PNCP Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Oldest date to backfill to (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
      no_consolidate:
        description: 'Skip end-of-run annual consolidation'
        required: false
        type: boolean
        default: false

concurrency:
  group: pncp-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Cache uv artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Sync locked dependencies
        # ETL jobs should run against lockfile-pinned deps for stable production behavior.
        run: uv sync --locked
      - id: month
        run: echo "key=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: data/raw
          key: pncp-raw-${{ steps.month.outputs.key }}-${{ github.run_id }}
          restore-keys: pncp-raw-${{ steps.month.outputs.key }}-
      - env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run baliza mirror \
            --start-date "${{ inputs.start_date || '2023-01-01' }}" \
            --limit-minutes 160
      - env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run baliza build \
            --start-date "${{ inputs.start_date || '2023-01-01' }}" \
            --limit-minutes 120
      - if: ${{ !inputs.no_consolidate }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: uv run baliza consolidate --start-year 2021

  report-failure:
    name: Report workflow failure
    if: ${{ failure() }}
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for failure
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const identifier = `run_id:${runId}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${identifier}" state:open type:issue`
            });
            if (search.data.total_count > 0) return;

            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Falha no workflow "PNCP Sync" (run #${context.runNumber})`,
              body: [
                '@codex há uma falha automática no workflow de sync.',
                '',
                `- **Workflow**: PNCP Sync`,
                `- **Execução**: [#${context.runNumber}](${runUrl})`,
                `- **Identificador**: ${identifier}`,
              ].join('\n'),
              labels: ['ci-failure']
            });
