name: Temporary Astro 7 migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/astro7-migration.yml'
      - 'web/package.json'
      - 'web/package-lock.json'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'ci/astro7-security-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: ci/astro7-security-migration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Upgrade Astro and official integrations
        working-directory: web
        run: |
          npm install astro@^7.1.6 @astrojs/svelte@latest @astrojs/sitemap@latest
          npm audit fix --omit=dev

      - name: Require production audit clean
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated dependency graph
        run: |
          if git diff --quiet -- web/package.json web/package-lock.json; then
            echo 'No dependency changes generated' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git commit -m 'chore(web): upgrade Astro security baseline to v7'
          git push origin HEAD:ci/astro7-security-migration
