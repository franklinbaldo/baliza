name: PNCP Backfill

on:
  # First of each month at 04:00 UTC. Picks up any historical month
  # that the cron sync missed (e.g. transient PNCP outage during the
  # original window). The workflow is idempotent — already-uploaded
  # months are skipped via the manifest check.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Earliest year to backfill (e.g. 2023)'
        required: false
        default: '2023'
      dry_run:
        description: 'Ingest and validate without uploading'
        required: false
        type: boolean
        default: false

concurrency:
  group: pncp-backfill
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
      - env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # Cron runs have empty `inputs.*`; default to the same window
          # the manual dispatch uses so the substitution stays valid.
          START_YEAR: ${{ inputs.start_year || '2023' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          extra=()
          if [[ "$DRY_RUN" == "true" ]]; then
            extra+=(--dry-run)
          fi
          uv run baliza build \
            --backfill \
            --start-date "${START_YEAR}-01-01" \
            --workers 2 \
            "${extra[@]}"
