name: PNCP Backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Earliest year to backfill (e.g. 2023)'
        required: false
        default: '2023'
      dry_run:
        description: 'Ingest and validate without uploading'
        required: false
        type: boolean
        default: false

concurrency:
  group: pncp-backfill
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Cache uv artifacts
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Sync locked dependencies
        # ETL jobs should run against lockfile-pinned deps for stable production behavior.
        run: uv sync --locked
      - env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run baliza build \
            --backfill \
            --start-date "${{ inputs.start_year }}-01-01" \
            --workers 2 \
            ${{ inputs.dry_run && '--dry-run' || '' }}
