name: Daily Export

# Secrets: nenhuma credencial adicional é necessária; o workflow utiliza apenas o GITHUB_TOKEN padrão.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  export:
    name: Run daily extraction and export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run incremental extract
        run: baliza extract --lookback-days=3 --duckdb baliza.duckdb --dataset baliza_raw

      - name: Export current month parquet snapshot
        run: |
          python scripts/export_parquet.py \
            contratos \
            --duckdb baliza.duckdb \
            --dataset baliza_raw \
            --output-dir data/contratos \
            --date-col dataPublicacaoPncp \
            --fallback-date-col dataAtualizacao \
            --current-month

      - name: Detect exported partition
        id: partition
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('data/contratos')
          partitions = []
          for year_dir in base.glob('ano=*'):
            year = year_dir.name.split('=', 1)[1]
            for month_dir in year_dir.glob('mes=*'):
              month = month_dir.name.split('=', 1)[1]
              partitions.append((year, month))

          if not partitions:
            raise SystemExit('No exported partitions found.')

          partitions.sort(key=lambda pair: (int(pair[0]), int(pair[1])))
          year, month = partitions[-1]
          with open('$GITHUB_OUTPUT', 'a', encoding='utf-8') as fh:
            fh.write(f"year={year}\n")
            fh.write(f"month={month}\n")
          PY

      - name: Package artifacts
        run: |
          tar -czf baliza-daily-${{ steps.partition.outputs.year }}-${{ steps.partition.outputs.month }}.tar.gz \
            baliza.duckdb \
            data/contratos/ano=${{ steps.partition.outputs.year }}/mes=${{ steps.partition.outputs.month }}

      - name: Upload daily artifact
        uses: actions/upload-artifact@v4
        with:
          name: baliza-daily-${{ steps.partition.outputs.year }}-${{ steps.partition.outputs.month }}
          path: baliza-daily-${{ steps.partition.outputs.year }}-${{ steps.partition.outputs.month }}.tar.gz

  report-failure:
    name: Report workflow failure
    if: ${{ failure() }}
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const attempt = context.runAttempt;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const workflowName = context.workflow;
            const identifier = `run_id:${runId}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${identifier}" state:open type:issue`
            });

            if (search.data.total_count > 0) {
              core.info('Existing issue found for this run, skipping creation.');
              return;
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner,
              repo,
              run_id: runId,
              attempt_number: attempt,
              per_page: 100
            });

            const failureDetails = [];
            const failingConclusions = new Set(['failure', 'cancelled', 'timed_out']);
            for (const job of jobsResponse.data.jobs) {
              if (!failingConclusions.has(job.conclusion)) {
                continue;
              }

              const stepLines = [];
              for (const step of job.steps ?? []) {
                if (failingConclusions.has(step.conclusion)) {
                  stepLines.push(`    • ${step.name} (${step.conclusion})`);
                }
              }

              if (stepLines.length > 0) {
                failureDetails.push(`- ${job.name} (${job.conclusion})\n${stepLines.join('\n')}`);
              } else {
                failureDetails.push(`- ${job.name} (${job.conclusion})`);
              }
            }

            const lines = [
              '@codex há uma falha automática no workflow agendado.',
              '',
              `- **Workflow**: ${workflowName}`,
              `- **Execução**: [#${context.runNumber}](${runUrl})`,
              `- **Evento**: ${context.eventName}`,
              `- **SHA**: ${context.sha}`,
            ];

            if (failureDetails.length > 0) {
              lines.push('', 'Jobs com falha:', ...failureDetails);
            }

            lines.push('', `Identificador automático: ${identifier}`);

            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Falha no workflow "${workflowName}" (run #${context.runNumber})`,
              body: lines.join('\n'),
              labels: ['ci-failure']
            });
