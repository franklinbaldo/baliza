name: Daily Pipeline

# Secrets: require IA_ACCESS_KEY and IA_SECRET_KEY for Internet Archive
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Prevent overlapping runs - skip if one is already running
concurrency:
  group: pncp-daily-export
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  export:
    name: Run daily extraction and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run incremental extract and upload
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          # 1. Always prioritize yesterday
          YESTERDAY=$(date -d "-1 day" +%Y-%m-%d)
          echo "Processing $YESTERDAY"
          uv run baliza extract --start $YESTERDAY --end $YESTERDAY --duckdb baliza.duckdb --dataset baliza_raw
          uv run baliza upload-daily --date $YESTERDAY --duckdb baliza.duckdb

          # 2. Backfill recent days to catch late publications
          for DAYS_AGO in 2 3; do
            TARGET_DATE=$(date -d "-$DAYS_AGO days" +%Y-%m-%d)
            echo "Processing backfill for $TARGET_DATE"
            uv run baliza extract --start $TARGET_DATE --end $TARGET_DATE --duckdb baliza.duckdb --dataset baliza_raw
            # upload-daily safely replaces/updates existing parquets and skips if no data
            uv run baliza upload-daily --date $TARGET_DATE --duckdb baliza.duckdb || true
          done

  report-failure:
    name: Report workflow failure
    if: ${{ failure() }}
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Open issue for failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const attempt = context.runAttempt;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            const workflowName = context.workflow;
            const identifier = `run_id:${runId}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${identifier}" state:open type:issue`
            });

            if (search.data.total_count > 0) {
              core.info('Existing issue found for this run, skipping creation.');
              return;
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner,
              repo,
              run_id: runId,
              attempt_number: attempt,
              per_page: 100
            });

            const failureDetails = [];
            const failingConclusions = new Set(['failure', 'cancelled', 'timed_out']);
            for (const job of jobsResponse.data.jobs) {
              if (!failingConclusions.has(job.conclusion)) {
                continue;
              }

              const stepLines = [];
              for (const step of job.steps ?? []) {
                if (failingConclusions.has(step.conclusion)) {
                  stepLines.push(`    • ${step.name} (${step.conclusion})`);
                }
              }

              if (stepLines.length > 0) {
                failureDetails.push(`- ${job.name} (${job.conclusion})\n${stepLines.join('\n')}`);
              } else {
                failureDetails.push(`- ${job.name} (${job.conclusion})`);
              }
            }

            const lines = [
              '@codex há uma falha automática no workflow agendado.',
              '',
              `- **Workflow**: ${workflowName}`,
              `- **Execução**: [#${context.runNumber}](${runUrl})`,
              `- **Evento**: ${context.eventName}`,
              `- **SHA**: ${context.sha}`,
            ];

            if (failureDetails.length > 0) {
              lines.push('', 'Jobs com falha:', ...failureDetails);
            }

            lines.push('', `Identificador automático: ${identifier}`);

            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Falha no workflow "${workflowName}" (run #${context.runNumber})`,
              body: lines.join('\n'),
              labels: ['ci-failure']
            });
