name: Continuous PNCP Extraction

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), defaults to yesterday'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD), defaults to yesterday'
        required: false
      force:
        description: 'Force extraction even if already complete'
        required: false
        default: 'false'

# Prevent overlapping runs - skip if one is already running
concurrency:
  group: pncp-extract
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  MAX_PAGES_PER_RUN: 20
  SLEEP_BETWEEN_PAGES: 2

jobs:
  extract:
    name: Extract PNCP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Download previous database state
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: baliza-db-state
          path: ./
          if_no_artifact_found: ignore
          workflow_conclusion: success

      - name: Calculate extraction dates (D-1 priority)
        id: dates
        run: |
          if [ -n "${{ inputs.start_date }}" ]; then
            START="${{ inputs.start_date }}"
            END="${{ inputs.end_date || inputs.start_date }}"
          else
            # Default: yesterday (D-1 priority)
            START=$(date -d "-1 day" +%Y-%m-%d)
            END=$START
          fi
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT
          echo "Extracting from $START to $END"

      - name: Check if extraction needed
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Force extraction requested"
            exit 0
          fi

          if [ ! -f baliza.duckdb ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "No existing database - extraction needed"
            exit 0
          fi

          # Check coverage in database
          RESULT=$(uv run python -c "
          import duckdb
          from datetime import datetime
          con = duckdb.connect('baliza.duckdb')
          try:
              result = con.execute('''
                  SELECT status FROM baliza_state.coverage
                  WHERE window_start = ? AND status = 'complete'
              ''', [datetime.strptime('${{ steps.dates.outputs.start }}', '%Y-%m-%d')]).fetchone()
              print('complete' if result else 'needed')
          except:
              print('needed')
          " 2>/dev/null || echo "needed")

          if [ "$RESULT" = "complete" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Extraction already complete for ${{ steps.dates.outputs.start }}"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Extraction needed for ${{ steps.dates.outputs.start }}"
          fi

      - name: Run extraction
        if: steps.check.outputs.needed == 'true'
        run: |
          echo "Extracting PNCP contracts..."
          uv run baliza extract \
            --start ${{ steps.dates.outputs.start }} \
            --end ${{ steps.dates.outputs.end }} \
            --duckdb baliza.duckdb \
            --dataset baliza_raw
        env:
          # Rate limiting via environment
          BALIZA_PAGE_DELAY: ${{ env.SLEEP_BETWEEN_PAGES }}

      - name: Verify extraction
        if: steps.check.outputs.needed == 'true'
        run: |
          uv run baliza verify \
            --start ${{ steps.dates.outputs.start }} \
            --end ${{ steps.dates.outputs.end }} \
            --duckdb baliza.duckdb

      - name: Save database state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baliza-db-state
          path: baliza.duckdb
          retention-days: 30
          overwrite: true

      - name: Summary
        run: |
          echo "## Extraction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date range**: ${{ steps.dates.outputs.start }} to ${{ steps.dates.outputs.end }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Extraction needed**: ${{ steps.check.outputs.needed }}" >> $GITHUB_STEP_SUMMARY

          if [ -f baliza.duckdb ]; then
            COUNT=$(uv run python -c "
          import duckdb
          con = duckdb.connect('baliza.duckdb')
          try:
              result = con.execute('SELECT COUNT(*) FROM baliza_raw.contratos').fetchone()
              print(result[0] if result else 0)
          except:
              print(0)
          " 2>/dev/null || echo "0")
            echo "- **Total contracts in DB**: $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
