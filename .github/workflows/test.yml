name: Run Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    name: Python V2 Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run Linting (Ruff)
        run: uv run ruff check src/ tests/

#      - name: Run V2 Integration Tests
#        run: uv run python -m unittest tests/test_baliza_v2.py

      - name: Create test summary
        if: always()
        run: |
          echo "## Python V2 Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Python: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "Engine: Ibis 12.0.0 (Native Path)" >> $GITHUB_STEP_SUMMARY
