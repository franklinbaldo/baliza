name: Run Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    name: Python V2 Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run Linting (Ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Run Type Checking (mypy)
        run: uv run mypy src/baliza

      - name: Run Python Tests
        # Skip integration/test_pncp_cassettes.py — that runs in the dedicated
        # pncp-cassette-check workflow with its own iptables network block.
        run: |
          uv run pytest tests/ \
            --ignore=tests/integration/test_pncp_cassettes.py \
            --tb=short \
            -q

      - name: Create test summary
        if: always()
        run: |
          echo "## Python V2 Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Python: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
