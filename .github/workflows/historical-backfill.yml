name: Historical Backfill

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
      max_days_per_run:
        description: 'Max days to process per run'
        required: false
        default: '5'
      direction:
        description: 'Backfill direction: forward (oldest first) or backward (newest first)'
        required: false
        default: 'forward'

concurrency:
  group: pncp-backfill
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  # PNCP launched around Jan 2023
  BACKFILL_START: '2023-01-01'
  MAX_DAYS_PER_RUN: 5
  IA_ITEM_PREFIX: 'baliza-pncp'

jobs:
  backfill:
    name: Historical backfill extraction
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Install Internet Archive CLI
        run: pip install internetarchive

      - name: Configure Internet Archive
        if: env.IA_ACCESS_KEY != ''
        run: |
          mkdir -p ~/.config
          cat > ~/.config/ia.ini << EOF
          [s3]
          access = ${{ secrets.IA_ACCESS_KEY }}
          secret = ${{ secrets.IA_SECRET_KEY }}
          EOF
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}

      - name: Download backfill state
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: backfill-state
          path: state/
          if_no_artifact_found: ignore
          workflow_conclusion: success

      - name: Download database state
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: baliza-db-state
          path: ./
          if_no_artifact_found: ignore
          workflow_conclusion: success


      - name: Validate database integrity
        run: |
          if [ -f baliza.duckdb ]; then
            echo "Checking baliza.duckdb integrity..."
            if python3 -c "
import duckdb, sys
try:
    con = duckdb.connect('baliza.duckdb')
    con.execute('SELECT 1')
    con.close()
    print('✅ Database is valid')
    sys.exit(0)
except Exception as e:
    print(f'❌ Database is corrupted: {e}')
    sys.exit(1)
" 2>&1; then
              echo "Database OK"
            else
              echo "⚠️ Corrupted database detected — removing and starting fresh"
              rm -f baliza.duckdb
            fi
          else
            echo "No existing database — will be created fresh"
          fi

      - name: Initialize state files
        run: |
          mkdir -p state
          touch state/completed.txt
          touch state/unavailable.txt
          touch state/uploaded_to_ia.txt

          echo "State files:"
          echo "  Completed dates: $(wc -l < state/completed.txt | tr -d ' ')"
          echo "  Unavailable dates: $(wc -l < state/unavailable.txt | tr -d ' ')"
          echo "  Uploaded to IA: $(wc -l < state/uploaded_to_ia.txt | tr -d ' ')"

      - name: Find dates to backfill
        id: find
        run: |
          START_DATE="${{ inputs.start_date || env.BACKFILL_START }}"
          MAX_DAYS="${{ inputs.max_days_per_run || env.MAX_DAYS_PER_RUN }}"
          DIRECTION="${{ inputs.direction || 'forward' }}"
          TODAY=$(date +%Y-%m-%d)

          echo "Backfill range: $START_DATE to $TODAY"
          echo "Direction: $DIRECTION"
          echo "Max days per run: $MAX_DAYS"

          # Generate all dates in range
          > all_dates.txt
          current="$START_DATE"
          while [[ "$current" < "$TODAY" ]]; do
            echo "$current" >> all_dates.txt
            current=$(date -d "$current + 1 day" +%Y-%m-%d)
          done

          TOTAL_DATES=$(wc -l < all_dates.txt | tr -d ' ')
          echo "Total dates in range: $TOTAL_DATES"

          # Filter out completed and unavailable
          > pending_dates.txt
          while read -r date; do
            if grep -q "^${date}$" state/completed.txt; then
              continue
            fi
            if grep -q "^${date}$" state/unavailable.txt; then
              continue
            fi
            echo "$date" >> pending_dates.txt
          done < all_dates.txt

          PENDING=$(wc -l < pending_dates.txt | tr -d ' ')
          echo "Pending dates: $PENDING"

          # Sort by direction
          if [ "$DIRECTION" = "forward" ]; then
            sort pending_dates.txt > sorted_dates.txt
          else
            sort -r pending_dates.txt > sorted_dates.txt
          fi

          # Take batch
          head -n "$MAX_DAYS" sorted_dates.txt > batch_dates.txt
          BATCH_SIZE=$(wc -l < batch_dates.txt | tr -d ' ')

          echo "Batch size: $BATCH_SIZE"
          echo "batch_size=$BATCH_SIZE" >> $GITHUB_OUTPUT
          echo "pending=$PENDING" >> $GITHUB_OUTPUT
          echo "total=$TOTAL_DATES" >> $GITHUB_OUTPUT

          if [ "$BATCH_SIZE" -gt 0 ]; then
            echo "Dates to process:"
            cat batch_dates.txt
          fi

      - name: Extract batch
        if: steps.find.outputs.batch_size != '0'
        run: |
          SUCCESS=0
          FAILED=0
          EMPTY=0

          while read -r DATE; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📅 Extracting: $DATE"

            # Run extraction for this date
            if uv run baliza extract \
                --start "$DATE" \
                --end "$DATE" \
                --duckdb baliza.duckdb \
                --dataset baliza_raw 2>&1 | tee extract.log; then

              # Check if any records were extracted
              RECORDS=$(uv run python -c "
          import duckdb
          con = duckdb.connect('baliza.duckdb')
          try:
              result = con.execute('''
                  SELECT COUNT(*) FROM baliza_raw.contratos
                  WHERE CAST(dataPublicacaoPncp AS DATE) = ?
              ''', ['$DATE']).fetchone()
              print(result[0] if result else 0)
          except Exception as e:
              print(0)
          " 2>/dev/null || echo "0")

              if [ "$RECORDS" -gt 0 ]; then
                echo "✅ Extracted $RECORDS contracts"
                echo "$DATE" >> state/completed.txt
                SUCCESS=$((SUCCESS + 1))
              else
                echo "⚠️ No data for this date (marking unavailable)"
                echo "$DATE" >> state/unavailable.txt
                EMPTY=$((EMPTY + 1))
              fi
            else
              echo "❌ Extraction failed"
              FAILED=$((FAILED + 1))
            fi

            # Rate limiting
            sleep 2

          done < batch_dates.txt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Batch complete: $SUCCESS success, $EMPTY empty, $FAILED failed"

      - name: Find dates ready for export
        if: steps.find.outputs.batch_size != '0'
        id: export-dates
        run: |
          # Find completed dates older than stability window (D-7)
          STABILITY_DAYS=7

          uv run python - << 'PY'
          import duckdb
          from pathlib import Path
          from datetime import datetime, timedelta

          STABILITY_DAYS = 7
          cutoff = datetime.now() - timedelta(days=STABILITY_DAYS)

          con = duckdb.connect('baliza.duckdb')

          # Load completed dates
          completed = set()
          completed_file = Path('state/completed.txt')
          if completed_file.exists():
              for line in completed_file.read_text().strip().split('\n'):
                  if line:
                      completed.add(line)

          # Load already uploaded to IA
          uploaded = set()
          uploaded_file = Path('state/uploaded_to_ia.txt')
          if uploaded_file.exists():
              for line in uploaded_file.read_text().strip().split('\n'):
                  if line:
                      # Format: baliza-pncp-YYYY-MM-DD
                      parts = line.split('-')
                      if len(parts) >= 5:
                          uploaded.add(f"{parts[2]}-{parts[3]}-{parts[4]}")

          # Find dates that are:
          # 1. Completed
          # 2. Older than stability window
          # 3. Not yet uploaded to IA
          ready_dates = []
          for date_str in completed:
              try:
                  dt = datetime.strptime(date_str, '%Y-%m-%d')
                  if dt < cutoff and date_str not in uploaded:
                      ready_dates.append(date_str)
              except ValueError:
                  continue

          ready_dates.sort()

          # Write ready dates for export
          with open('ready_dates.txt', 'w') as f:
              for d in ready_dates:
                  f.write(f"{d}\n")

          print(f"Dates ready for export (D-{STABILITY_DAYS}): {len(ready_dates)}")
          if ready_dates:
              print(f"  Range: {ready_dates[0]} to {ready_dates[-1]}")
          PY

          READY_COUNT=$(wc -l < ready_dates.txt 2>/dev/null | tr -d ' ' || echo "0")
          echo "ready_count=$READY_COUNT" >> $GITHUB_OUTPUT

      - name: Export daily Parquet files
        if: steps.find.outputs.batch_size != '0' && steps.export-dates.outputs.ready_count != '0'
        run: |
          mkdir -p data/daily

          # Export up to 10 days per run to avoid timeout
          head -n 10 ready_dates.txt > export_batch.txt

          while read -r DATE; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Exporting: $DATE"

            if uv run baliza export-daily \
                --date "$DATE" \
                --output data/daily \
                --duckdb baliza.duckdb \
                --dataset baliza_raw; then
              echo "✅ Exported $DATE"
            else
              echo "❌ Export failed for $DATE"
            fi

          done < export_batch.txt

      - name: Upload to Internet Archive
        if: steps.find.outputs.batch_size != '0' && steps.export-dates.outputs.ready_count != '0' && env.IA_ACCESS_KEY != ''
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
        run: |
          if [ ! -d data/daily ]; then
            echo "No parquet files to upload"
            exit 0
          fi

          # Find daily directories not yet uploaded
          for DATE_DIR in data/daily/*/; do
            DATE=$(basename "$DATE_DIR")
            ITEM_ID="${IA_ITEM_PREFIX}-${DATE}"

            # Check if already uploaded
            if grep -q "^${ITEM_ID}$" state/uploaded_to_ia.txt 2>/dev/null; then
              echo "⏭️ $ITEM_ID already uploaded"
              continue
            fi

            echo "📤 Uploading $DATE to $ITEM_ID..."

            # Upload all files in the daily directory
            if ia upload "$ITEM_ID" "${DATE_DIR}"* \
                --metadata="collection:opensource" \
                --metadata="mediatype:data" \
                --metadata="title:Baliza PNCP Contracts ${DATE}" \
                --metadata="description:Brazilian public procurement contracts from PNCP (Portal Nacional de Contratações Públicas) for ${DATE}. Contains contratos, orgaos, and unidades tables in Parquet format." \
                --metadata="subject:brazil;procurement;pncp;open-data;government;contracts" \
                --metadata="creator:Baliza Project" \
                --no-derive; then
              echo "$ITEM_ID" >> state/uploaded_to_ia.txt
              echo "✅ Uploaded $ITEM_ID"
            else
              echo "❌ Failed to upload $ITEM_ID"
            fi

            # Rate limiting for IA
            sleep 5
          done

      - name: Cleanup buffer after successful uploads
        if: steps.find.outputs.batch_size != '0' && steps.export-dates.outputs.ready_count != '0' && env.IA_ACCESS_KEY != ''
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
        run: |
          if [ ! -f state/uploaded_to_ia.txt ]; then
            echo "No uploads to clean up"
            exit 0
          fi

          echo "Cleaning up buffer for uploaded dates..."

          # For each uploaded item, clean up the corresponding data from DuckDB
          uv run python - << 'PY'
          import duckdb
          from pathlib import Path
          from datetime import datetime

          uploaded_file = Path('state/uploaded_to_ia.txt')
          if not uploaded_file.exists():
              print("No uploaded items file")
              exit(0)

          # Parse uploaded items (format: baliza-pncp-YYYY-MM-DD)
          uploaded_dates = []
          for line in uploaded_file.read_text().strip().split('\n'):
              if not line:
                  continue
              # Extract date from item ID
              parts = line.split('-')
              if len(parts) >= 5:
                  try:
                      date_str = f"{parts[2]}-{parts[3]}-{parts[4]}"
                      uploaded_dates.append(date_str)
                  except (ValueError, IndexError):
                      continue

          if not uploaded_dates:
              print("No valid uploaded dates found")
              exit(0)

          print(f"Found {len(uploaded_dates)} uploaded dates to clean up")

          con = duckdb.connect('baliza.duckdb')

          total_deleted = 0
          for date_str in uploaded_dates:
              # Count rows before deletion
              result = con.execute('''
                  SELECT COUNT(*) FROM baliza_raw.contratos
                  WHERE CAST(dataPublicacao AS DATE) = ?
              ''', [date_str]).fetchone()
              count = result[0] if result else 0

              if count > 0:
                  # Delete data for this date
                  con.execute('''
                      DELETE FROM baliza_raw.contratos
                      WHERE CAST(dataPublicacao AS DATE) = ?
                  ''', [date_str])
                  print(f"✅ Cleaned up {count} rows for {date_str}")
                  total_deleted += count

                  # Record in uploaded_to_ia table
                  con.execute('''
                      INSERT OR REPLACE INTO baliza_state.uploaded_to_ia
                      VALUES (?, ?, NOW(), 3, ?)
                  ''', [f"baliza-pncp-{date_str}", date_str, count])
              else:
                  print(f"⏭️ No data to clean for {date_str}")

          print(f"\nTotal rows cleaned from buffer: {total_deleted}")

          # Show buffer stats
          result = con.execute('SELECT COUNT(*) FROM baliza_raw.contratos').fetchone()
          print(f"Rows remaining in buffer: {result[0]}")
          PY

      - name: Save database state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baliza-db-state
          path: baliza.duckdb
          retention-days: 30
          overwrite: true

      - name: Save backfill state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-state
          path: state/
          retention-days: 90
          overwrite: true

      - name: Summary
        run: |
          COMPLETED=$(wc -l < state/completed.txt | tr -d ' ')
          UNAVAILABLE=$(wc -l < state/unavailable.txt | tr -d ' ')
          UPLOADED=$(wc -l < state/uploaded_to_ia.txt | tr -d ' ')
          PENDING="${{ steps.find.outputs.pending }}"
          TOTAL="${{ steps.find.outputs.total }}"

          PROGRESS=$((COMPLETED + UNAVAILABLE))
          if [ "$TOTAL" -gt 0 ]; then
            PCT=$((PROGRESS * 100 / TOTAL))
          else
            PCT=0
          fi

          echo "## Backfill Progress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total dates in range | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Completed | $COMPLETED |" >> $GITHUB_STEP_SUMMARY
          echo "| Unavailable (no data) | $UNAVAILABLE |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending | $PENDING |" >> $GITHUB_STEP_SUMMARY
          echo "| **Progress** | **${PCT}%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Internet Archive | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Days uploaded | $UPLOADED |" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "Progress: $PROGRESS / $TOTAL ($PCT%)"
          echo "Days on Internet Archive: $UPLOADED"

      - name: Generate dashboard status
        if: always()
        run: |
          mkdir -p docs/dashboard

          uv run python - << 'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          # Load state files
          completed = []
          pending = []
          empty = []

          completed_file = Path('state/completed.txt')
          if completed_file.exists():
              completed = [l for l in completed_file.read_text().strip().split('\n') if l]

          unavailable_file = Path('state/unavailable.txt')
          if unavailable_file.exists():
              empty = [l for l in unavailable_file.read_text().strip().split('\n') if l]

          uploaded_file = Path('state/uploaded_to_ia.txt')
          uploaded = []
          if uploaded_file.exists():
              uploaded = [l for l in uploaded_file.read_text().strip().split('\n') if l]

          # Get buffer stats from DuckDB
          buffer_stats = {"total_rows": 0, "dates_in_buffer": 0, "pending_checkpoints": 0}
          recent_dates = []

          try:
              import duckdb
              if Path('baliza.duckdb').exists():
                  con = duckdb.connect('baliza.duckdb', read_only=True)
                  try:
                      result = con.execute('SELECT COUNT(*) FROM baliza_raw.contratos').fetchone()
                      buffer_stats["total_rows"] = result[0] if result else 0

                      result = con.execute('''
                          SELECT CAST(dataPublicacao AS DATE) as dt, COUNT(*) as cnt
                          FROM baliza_raw.contratos
                          GROUP BY dt ORDER BY dt DESC LIMIT 20
                      ''').fetchall()
                      buffer_stats["dates_in_buffer"] = len(result)

                      for row in result[:10]:
                          date_str = str(row[0])
                          status = 'uploaded' if any(date_str in u for u in uploaded) else 'complete'
                          recent_dates.append({"date": date_str, "contracts": row[1], "status": status})

                      result = con.execute('SELECT COUNT(*) FROM baliza_state.extraction_checkpoint').fetchone()
                      buffer_stats["pending_checkpoints"] = result[0] if result else 0
                  except Exception as e:
                      print(f"DB query error: {e}")
          except Exception as e:
              print(f"Database unavailable: {e}")

          # Build status
          status = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "mode": "backfill",
              "stats": {
                  "total_contracts": buffer_stats["total_rows"],
                  "contracts_today": 0,
                  "days_on_ia": len(uploaded),
              },
              "backfill": {
                  "completed": len(completed),
                  "pending": 0,  # Will be calculated by workflow
                  "empty": len(empty),
                  "oldest_target": min(completed) if completed else None,
              },
              "buffer": buffer_stats,
              "recent_dates": recent_dates,
          }

          # Write status.json
          Path('docs/dashboard/status.json').write_text(json.dumps(status, indent=2))
          print(f"Generated status.json: {len(completed)} completed, {len(uploaded)} uploaded")
          PY

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: docs/dashboard/
          retention-days: 30
          overwrite: true
