name: PNCP Cassette Check

# Validates that:
#   1. Cassette files are committed to the repo (presence check).
#   2. All cassette-based integration tests pass using only the pre-recorded
#      YAML files — no live network calls to pncp.gov.br.
#
# Weekly schedule (Mondays 06:00 UTC): re-records cassettes and opens a PR
# if any responses changed — keeps fixtures from going silently stale.
#
# To refresh cassettes manually after an API schema change:
#   uv run python scripts/record_pncp_cassettes.py
# then commit the updated files in tests/cassettes/pncp/.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/cassettes/**'
      - 'tests/integration/test_pncp_cassettes.py'
      - 'src/**'
      - 'scripts/record_pncp_cassettes.py'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'tests/cassettes/**'
      - 'tests/integration/test_pncp_cassettes.py'
      - 'src/**'
  schedule:
    # Every Monday at 06:00 UTC — refresh cassettes from the live API.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      refresh_cassettes:
        description: 'Re-record cassettes from the live PNCP API'
        type: boolean
        default: false

jobs:
  cassette-check:
    name: PNCP Cassette Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Refresh cassettes (scheduled / manual)
        # Runs on the weekly cron or when refresh_cassettes=true is set.
        # Overwrites cassette files with fresh PNCP API responses.
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_cassettes)
        run: uv run python scripts/record_pncp_cassettes.py

      - name: Open PR if cassettes changed after refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_cassettes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet tests/cassettes/; then
            echo "Cassettes unchanged — no PR needed."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH="chore/refresh-pncp-cassettes-$(date +%Y-%m-%d)"
            git checkout -b "$BRANCH"
            git add tests/cassettes/
            git commit -m "chore(cassettes): refresh PNCP cassettes $(date +%Y-%m-%d)"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore(cassettes): refresh PNCP cassettes $(date +%Y-%m-%d)" \
              --body "Automated weekly refresh of PNCP API cassettes. Review the diff to confirm the schema is unchanged before merging." \
              --base main \
              --head "$BRANCH"
          fi

      - name: Verify cassette files are present
        run: |
          REQUIRED=(
            tests/cassettes/pncp/contratos_page1.yaml
            tests/cassettes/pncp/publicacao_pregao_page1.yaml
            tests/cassettes/pncp/publicacao_dispensa_page1.yaml
            tests/cassettes/pncp/publicacao_inexigibilidade_page1.yaml
            tests/cassettes/pncp/publicacao_municipio_pregao_page1.yaml
          )
          missing=()
          for f in "${REQUIRED[@]}"; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing cassette files: ${missing[*]}"
            echo ""
            echo "Re-record with:"
            echo "  uv run python scripts/record_pncp_cassettes.py"
            echo "then commit the files in tests/cassettes/pncp/"
            exit 1
          fi
          echo "All required cassette files present:"
          for f in "${REQUIRED[@]}"; do
            echo "  $(wc -c < "$f") bytes  $f"
          done

      - name: Block outbound connections to pncp.gov.br
        # Hard network-level block so any unrecorded requests.get() raises a
        # connection error rather than hitting the live API and making CI
        # non-deterministic.  VCR record_mode=none is the primary guard
        # (raises CannotOverwriteExistingCassetteException for unmatched
        # requests); this iptables rule is a belt-and-suspenders backstop.
        run: sudo iptables -A OUTPUT -d pncp.gov.br -j REJECT

      - name: Run PNCP cassette integration tests
        run: |
          uv run pytest tests/integration/test_pncp_cassettes.py \
            --tb=short \
            --no-header \
            -v

      - name: Cassette summary
        if: always()
        run: |
          echo "## PNCP Cassette Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cassette | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in tests/cassettes/pncp/*.yaml; do
            name=$(basename "$f")
            size=$(wc -c < "$f")
            echo "| \`$name\` | ${size} bytes |" >> "$GITHUB_STEP_SUMMARY"
          done
