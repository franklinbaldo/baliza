<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baliza Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .heatmap-cell { width: 12px; height: 12px; border-radius: 2px; }
        .heatmap-grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [status, setStatus] = useState(null);
            const [loading, setLoading] = useState(true);
            const [refreshing, setRefreshing] = useState(false);
            const [error, setError] = useState(null);

            const fetchData = (isRefresh = false) => {
                if (isRefresh) setRefreshing(true);
                fetch('./status.json?t=' + Date.now())
                    .then(res => {
                        if (!res.ok) throw new Error("Failed to load status.json");
                        return res.json();
                    })
                    .then(data => {
                        setStatus(data);
                        setError(null);
                        setLoading(false);
                        if (isRefresh) setRefreshing(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setError(err.message);
                        setLoading(false);
                        if (isRefresh) setRefreshing(false);
                    });
            };

            useEffect(() => {
                fetchData();

                const handleKeyDown = (e) => {
                    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) {
                        fetchData(true);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            useEffect(() => {
                if (!loading) {
                    lucide.createIcons();
                }
            }, [loading, status, refreshing]);

            if (loading) return (
                <div className="flex flex-col items-center justify-center h-screen text-slate-400 space-y-4" role="status" aria-live="polite">
                    <div className="w-12 h-12 border-4 border-slate-700 border-t-emerald-500 rounded-full animate-spin"></div>
                    <p className="font-medium text-slate-500 animate-pulse">Carregando dashboard...</p>
                </div>
            );
            if (error) return <div className="flex items-center justify-center h-screen text-red-400">Erro: {error}. Execute o workflow para gerar dados.</div>;
            if (!status) return null;

            const totalBackfill = (status.backfill?.completed || 0) + (status.backfill?.pending || 0) + (status.backfill?.empty || 0);
            const progressPct = totalBackfill > 0 ? Math.round(((status.backfill?.completed || 0) + (status.backfill?.empty || 0)) / totalBackfill * 100) : 0;

            return (
                <div className="max-w-6xl mx-auto p-6">
                    <header className="mb-8 flex justify-between items-start">
                        <div>
                            <h1 className="text-3xl font-bold text-white mb-2">Baliza Monitor</h1>
                            <p className="text-slate-400">
                                Última atualização: {new Date(status.generated_at).toLocaleString('pt-BR')}
                                <span className="mx-2">•</span>
                                Modo: <span className="uppercase text-xs font-semibold px-2 py-0.5 rounded bg-slate-700 text-slate-200">{status.mode}</span>
                            </p>
                        </div>
                        <button
                            onClick={() => fetchData(true)}
                            className="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-700 transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-900"
                            aria-label="Atualizar dados (R)"
                            title="Atualizar dados (Pressione 'R')"
                            disabled={refreshing}
                        >
                            <span key={refreshing ? 'spin' : 'static'}>
                                <i data-lucide="refresh-cw" className={`w-5 h-5 ${refreshing ? 'animate-spin text-emerald-500' : ''}`}></i>
                            </span>
                        </button>
                    </header>

                    {/* KPI Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        <Card title="Total de Contratos" value={status.stats?.total_contracts?.toLocaleString('pt-BR')} icon="file-text" color="text-emerald-400" />
                        <Card title="Dias no Archive.org" value={status.stats?.days_on_ia} icon="archive" color="text-blue-400" />
                        <Card title="Buffer Local (Linhas)" value={status.buffer?.total_rows?.toLocaleString('pt-BR')} icon="database" color="text-amber-400" />
                        <Card title="Progresso Backfill" value={`${progressPct}%`} icon="percent" color="text-indigo-400" />
                    </div>

                    {/* Progress Bar */}
                    <div
                        className="bg-slate-800 rounded-lg p-6 mb-8 border border-slate-700"
                        role="region"
                        aria-label="Progresso do Backfill"
                    >
                        <div className="flex justify-between items-end mb-2" id="progress-label">
                            <h2 className="text-lg font-semibold text-slate-200">Progresso Geral</h2>
                            <div className="text-sm text-slate-400">
                                {status.backfill?.completed} completos · {status.backfill?.empty} vazios · {status.backfill?.pending} pendentes
                            </div>
                        </div>
                        <div
                            className="h-4 bg-slate-700 rounded-full overflow-hidden"
                            role="progressbar"
                            aria-valuenow={progressPct}
                            aria-valuemin="0"
                            aria-valuemax="100"
                            aria-labelledby="progress-label"
                        >
                            <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${progressPct}%` }}></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Heatmap Section */}
                        <div className="lg:col-span-2 bg-slate-800 rounded-lg p-6 border border-slate-700">
                            <h2 className="text-lg font-semibold text-slate-200 mb-4">Cobertura de Dados</h2>
                            <Heatmap completed={status.backfill?.completed} empty={status.backfill?.empty} />
                            <div className="flex gap-4 mt-4 text-xs text-slate-400">
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-emerald-500 rounded-sm"></div> Completo</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-slate-600 rounded-sm"></div> Vazio (Sem dados)</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-slate-900 border border-slate-700 rounded-sm"></div> Pendente</div>
                            </div>
                        </div>

                        {/* Recent Activity */}
                        <div className="bg-slate-800 rounded-lg p-6 border border-slate-700">
                            <h2 className="text-lg font-semibold text-slate-200 mb-4">Atividade Recente</h2>
                            <div className="overflow-hidden">
                                <table className="w-full text-sm">
                                    <thead>
                                        <tr className="text-left text-slate-500 border-b border-slate-700">
                                            <th className="pb-2 font-medium">Data</th>
                                            <th className="pb-2 font-medium text-right">Contratos</th>
                                            <th className="pb-2 font-medium text-right">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {(status.recent_dates || []).slice(0, 10).map((row, i) => (
                                            <tr key={i} className="hover:bg-slate-700/50">
                                                <td className="py-2 text-slate-300">{row.date}</td>
                                                <td className="py-2 text-right text-slate-300">{row.contracts?.toLocaleString('pt-BR')}</td>
                                                <td className="py-2 text-right">
                                                    <StatusBadge status={row.status} />
                                                </td>
                                            </tr>
                                        ))}
                                        {(!status.recent_dates || status.recent_dates.length === 0) && (
                                            <tr><td colSpan="3" className="py-4 text-center text-slate-500">Sem atividade recente</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <footer className="mt-12 text-center text-slate-500 text-sm">
                        <a href="https://github.com/franklinbaldo/baliza" className="hover:text-blue-400 transition-colors">GitHub Repository</a>
                        <span className="mx-2">·</span>
                        <a href="https://archive.org/search?query=creator%3A%22Baliza+Project%22" className="hover:text-blue-400 transition-colors">Internet Archive</a>
                    </footer>
                </div>
            );
        }

        function Card({ title, value, icon, color }) {
            return (
                <div className="bg-slate-800 p-6 rounded-lg border border-slate-700 flex items-start justify-between">
                    <div>
                        <h3 className="text-slate-400 text-sm font-medium mb-1">{title}</h3>
                        <p className={`text-2xl font-bold ${color}`}>{value || 0}</p>
                    </div>
                    <div className={`p-2 rounded-lg bg-slate-700/50 ${color}`} aria-hidden="true">
                        <i data-lucide={icon} className="w-6 h-6"></i>
                    </div>
                </div>
            );
        }

        function StatusBadge({ status }) {
            const colors = {
                uploaded: "bg-emerald-900/30 text-emerald-400 border-emerald-900",
                complete: "bg-blue-900/30 text-blue-400 border-blue-900",
                pending: "bg-amber-900/30 text-amber-400 border-amber-900",
            };
            const cls = colors[status] || "bg-slate-700 text-slate-400";
            return (
                <span className={`text-xs px-2 py-0.5 rounded border ${cls}`}>
                    {status}
                </span>
            );
        }

        function Heatmap({ completed, empty }) {
            // Simulated heatmap visualization since we don't have the full daily array in status.json yet
            // In a real scenario, status.json should provide a bitmask or array of statuses for the year
            // Here we render a placeholder grid for visual effect based on the request

            // Generate last 365 days placeholder
            const TOTAL_DAYS = 160;
            const days = Array.from({ length: TOTAL_DAYS }).map((_, i) => {
                 // Mock pattern
                 if (i < (completed || 0)) return 'complete';
                 if (i < (completed + (empty || 0))) return 'empty';
                 return 'missing';
            });

            const missing = TOTAL_DAYS - (completed || 0) - (empty || 0);
            const a11yLabel = `Mapa de calor dos últimos ${TOTAL_DAYS} dias: ${completed || 0} completos, ${empty || 0} vazios, ${missing} pendentes.`;

            return (
                <div
                    className="overflow-x-auto pb-2"
                    role="img"
                    aria-label={a11yLabel}
                >
                    <div className="heatmap-grid" style={{ minWidth: 'max-content' }}>
                        {days.map((status, i) => (
                            <div
                                key={i}
                                className={`heatmap-cell transition-all duration-200 ease-out hover:scale-150 hover:z-10 hover:ring-2 hover:ring-offset-2 hover:ring-offset-slate-800 hover:ring-white/50 ${
                                    status === 'complete' ? 'bg-emerald-500' :
                                    status === 'empty' ? 'bg-slate-600' :
                                    'bg-slate-900 border border-slate-800'
                                }`}
                                title={`Day ${i+1}: ${status}`}
                            ></div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
